<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class=chat-container>
        <div class="user-chat-box">
            <img src="cat.jpg" alt="" id="userImage" width = 50>   <!--Add user image in src-->
            <div class="user-chat-area">

            </div>
        </div>
        <div class="ai-chat-box">
            <img src="dog.png" alt="" id="aiImage" width = 50>    <!--Add AI bot image in src-->
            <div class="ai-chat-area"></div>
        </div>
    </div>
    <div class="prompt-area">
        <input type="text" id="prompt" placeholder="Ask Sakura">
        <button id="image"><img src="img.svg" alt=""></button>
        <button id="submit"><img src="submit.svg" alt=""></button>

    </div>
    
</body>
</html>
